[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loto-research"
version = "0.1.0"
description = "LOTO MAROC Research Engine — audit statistique et test de predictibilite hors-echantillon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pandas>=3.0",
  "numpy>=2.0",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "openpyxl>=3.1",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "pytest>=8",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
change-points = ["ruptures>=1.1"]   # Phase 5 (spec 28)
dashboard = ["streamlit>=1.40", "plotly>=5"]
viz = ["seaborn>=0.13", "plotly>=5"]
boosting = ["xgboost", "lightgbm"]  # uniquement si les modeles classiques le justifient (spec 33)

[project.scripts]
loto = "loto_research.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
